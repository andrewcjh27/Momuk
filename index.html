<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>momuk — 오늘 뭐 먹지</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="날씨와 시간, 배고픔에 맞춰 오늘 뭐 먹을지 정해드립니다." />
<meta name="theme-color" content="#E7DCCB" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@900&display=swap" />
<link rel="stylesheet" href="momuk.css" />
</head>
<body>

<div class="app" id="app">

  <!-- One bowl for the entire flow: mascot, and progress meter. -->
  <div class="bowl-dock is-centred" id="bowlDock">
    <svg class="bowl" id="bowl" viewBox="0 0 120 92" aria-hidden="true">
      <defs>
        <clipPath id="bowlInside">
          <path d="M12 34 h96 l-11 34 a15 15 0 0 1 -14 10 h-46 a15 15 0 0 1 -14 -10 z" />
        </clipPath>
      </defs>
      <!-- liquid: translated down when empty, up to 0 when full -->
      <g clip-path="url(#bowlInside)">
        <rect class="bowl__fill" id="bowlFill" x="8" y="30" width="104" height="52"
              transform="translate(0 52)" />
      </g>
      <path class="bowl__vessel"
            d="M12 34 h96 l-11 34 a15 15 0 0 1 -14 10 h-46 a15 15 0 0 1 -14 -10 z" />
      <line class="bowl__rim" x1="9" y1="34" x2="111" y2="34" />
      <path class="bowl__steam" d="M45 24 q5 -7 0 -14" />
      <path class="bowl__steam" d="M60 21 q5 -8 0 -16" />
      <path class="bowl__steam" d="M75 24 q5 -7 0 -14" />
    </svg>
  </div>

  <!-- ── landing ─────────────────────────────────────── -->
  <section class="screen is-active" id="s-landing" aria-label="momuk">
    <div class="topbar">
      <span class="iconbtn" hidden></span>
      <div class="langtoggle" role="group" aria-label="Language">
        <button id="langKo" aria-pressed="true">한국어</button>
        <button id="langEn" aria-pressed="false">EN</button>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="mast">
      <h1 class="wordmark wordmark--lg"><em>M</em>o<em>M</em>uk</h1>
      <p class="jamo jamo--lg" aria-label="모먹">
        <b style="--i:0">ㅁ</b><i style="--i:1">ㅗ</i><b style="--i:2">ㅁ</b><i style="--i:3">ㅓ</i><i style="--i:4">ㄱ</i>
      </p>
    </div>

    <div class="spacer"></div>
    <div class="spacer"></div>

    <div class="stack">
      <button class="cta enter" style="--i:6" id="start">시작하기</button>
      <p class="status" id="status"></p>
    </div>
  </section>

  <!-- ── Q1 · party size ─────────────────────────────── -->
  <section class="screen" id="s-q1" aria-label="몇 명이야?">
    <div class="topbar">
      <button class="iconbtn" data-back aria-label="뒤로">←</button>
      <h2 class="wordmark wordmark--sm"><em>M</em>o<em>M</em>uk</h2>
      <span class="iconbtn" hidden></span>
    </div>
    <p class="jamo jamo--sm" aria-hidden="true"><b>ㅁ</b><i>ㅗ</i><b>ㅁ</b><i>ㅓ</i><i>ㄱ</i></p>

    <div class="spacer"></div>

    <div class="stack">
      <p class="bubble enter" style="--i:0" id="q1Ask">몇 명이야?</p>
      <div class="options" id="q1Options"></div>
    </div>

    <div class="spacer"></div>
    <button class="linkbtn" data-skip>넘기기</button>
  </section>

  <!-- ── Q2 · hunger ─────────────────────────────────── -->
  <section class="screen" id="s-q2" aria-label="얼마나 배고파?">
    <div class="topbar">
      <button class="iconbtn" data-back aria-label="뒤로">←</button>
      <h2 class="wordmark wordmark--sm"><em>M</em>o<em>M</em>uk</h2>
      <span class="iconbtn" hidden></span>
    </div>
    <p class="jamo jamo--sm" aria-hidden="true"><b>ㅁ</b><i>ㅗ</i><b>ㅁ</b><i>ㅓ</i><i>ㄱ</i></p>

    <div class="spacer"></div>

    <div class="stack">
      <p class="bubble enter" style="--i:0" id="q2Ask">얼마나 배고파?</p>
      <div class="slider enter" style="--i:1">
        <input type="range" id="hunger" min="1" max="10" value="5"
               aria-labelledby="q2Ask" />
        <div class="slider__ends"><span id="q2Lo">가볍게</span><span id="q2Hi">든든하게</span></div>
        <p class="slider__read" id="hungerRead"></p>
      </div>
      <button class="cta enter" style="--i:2" data-next>다음</button>
    </div>

    <div class="spacer"></div>
    <button class="linkbtn" data-skip>넘기기</button>
  </section>

  <!-- ── Q3 · budget ─────────────────────────────────── -->
  <section class="screen" id="s-q3" aria-label="가격 범위는?">
    <div class="topbar">
      <button class="iconbtn" data-back aria-label="뒤로">←</button>
      <h2 class="wordmark wordmark--sm"><em>M</em>o<em>M</em>uk</h2>
      <span class="iconbtn" hidden></span>
    </div>
    <p class="jamo jamo--sm" aria-hidden="true"><b>ㅁ</b><i>ㅗ</i><b>ㅁ</b><i>ㅓ</i><i>ㄱ</i></p>

    <div class="spacer"></div>

    <div class="stack">
      <p class="bubble enter" style="--i:0" id="q3Ask">가격 범위는?</p>
      <div class="slider enter" style="--i:1">
        <input type="range" id="budget" min="1" max="3" value="2"
               aria-labelledby="q3Ask" />
        <div class="slider__ends"><span id="q3Lo">저렴한거</span><span id="q3Hi">상관없어</span></div>
        <p class="slider__read" id="budgetRead"></p>
      </div>
      <button class="cta enter" style="--i:2" data-next>추천받기</button>
    </div>

    <div class="spacer"></div>
    <button class="linkbtn" data-skip>넘기기</button>
  </section>

  <!-- ── thinking beat ───────────────────────────────── -->
  <section class="screen" id="s-thinking" aria-label="생각 중" aria-live="polite">
    <div class="topbar"><span class="iconbtn" hidden></span></div>
    <div class="spacer"></div>
    <div class="thinking" id="thinkingLines"></div>
    <div class="spacer"></div>
  </section>

  <!-- ── response ────────────────────────────────────── -->
  <section class="screen" id="s-response" aria-label="추천">
    <div class="topbar">
      <button class="iconbtn" data-back aria-label="뒤로">←</button>
      <h2 class="wordmark wordmark--sm"><em>M</em>o<em>M</em>uk</h2>
      <span class="iconbtn" hidden></span>
    </div>
    <p class="jamo jamo--sm" aria-hidden="true"><b>ㅁ</b><i>ㅗ</i><b>ㅁ</b><i>ㅓ</i><i>ㄱ</i></p>

    <div class="spacer"></div>

    <div class="stack">
      <div class="answer" id="answer" role="status">
        <p class="answer__lead reveal" style="--i:0" id="answerLead">내 추천은…</p>
        <p class="answer__dish reveal" style="--i:1" id="dish"></p>
        <p class="answer__en reveal" style="--i:2" id="dishEn"></p>
        <ul class="why" id="why"></ul>
      </div>
      <button class="cta enter" style="--i:5" id="accept">이걸로!</button>
      <button class="linkbtn" id="again">음… 안 땡겨!</button>
    </div>

    <div class="spacer"></div>
  </section>

  <!-- ── accepted ────────────────────────────────────── -->
  <section class="screen" id="s-done" aria-label="맛있게">
    <div class="topbar"><span class="iconbtn" hidden></span></div>
    <div class="spacer"></div>
    <div class="mast">
      <p class="answer__dish reveal" style="--i:0" id="doneDish"></p>
      <p class="status reveal" style="--i:1" id="doneNote"></p>
    </div>
    <div class="spacer"></div>
    <div class="stack">
      <button class="cta enter" style="--i:3" id="restart">다시 고르기</button>
    </div>
  </section>

</div>

<script src="momuk-data.js"></script>
<script src="momuk-engine.js"></script>
<script src="momuk-app.js"></script>
</body>
</html>
